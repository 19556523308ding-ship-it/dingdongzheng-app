<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>丁东政的 Minecraft 世界</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; overflow: hidden; touch-action: none; }
    #game { width: 100vw; height: 100vh; display: block; }
    #blocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 10; }
    #instructions { text-align: center; color: #fff; cursor: pointer; }
    #instructions h1 { font-size: 40px; margin-bottom: 20px; }
    #instructions p { font-size: 16px; line-height: 1.6; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
    #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
    #crosshair::after { top: 9px; left: 0; width: 20px; height: 2px; }
    #toolbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; background: rgba(0,0,0,0.5); border-radius: 12px; pointer-events: auto; z-index: 5; }
    .slot { width: 46px; height: 46px; border: 2px solid #555; background: rgba(100,100,100,0.5); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; color: #fff; cursor: pointer; }
    .slot.active { border-color: #38bdf8; background: rgba(56,189,248,0.3); }
    .slot-icon { width: 30px; height: 30px; margin-bottom: 2px; }
    #info { position: absolute; top: 10px; left: 10px; font-size: 12px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; z-index: 5; }
    #message { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #fff; text-shadow: 2px 2px 4px #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5; }
  </style>
</head>
<body>
  <div id="blocker">
    <div id="instructions">
      <h1>⛏️ 丁东政的 Minecraft 世界</h1>
      <p>点击屏幕开始游戏！</p>
      <p>🖱️ 鼠标移动：观察四周</p>
      <p>⬅️⬆️⬇️⬅️ 键盘 WASD 移动，空格跳跃</p>
      <p>⬅️⬆️⬇️⬅️ 左键：挖矿/采集</p>
      <p>⬅️⬆️⬇️⬅️ 右键：放置方块</p>
      <p>⬅️⬆️⬇️⬅️ 数字键 1-9：选择方块</p>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="info">方块：草地</div>
  <div id="message"></div>
  <div id="toolbar"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const blocker = document.getElementById('blocker');
    const instructions = document.getElementById('instructions');
    let camera, scene, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false;
    let pitchObject, yawObject;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();
    const objects = [];
    let selectedBlock = 1;

    const BLOCKS = [
      { id: 1, name: '草地', color: '#5cb85c' },
      { id: 2, name: '泥土', color: '#8b5a2b' },
      { id: 3, name: '石头', color: '#7f8c8d' },
      { id: 4, name: '原木', color: '#a0522d' },
      { id: 5, name: '木板', color: '#d2691e' },
      { id: 6, name: '树叶', color: '#27ae60' },
      { id: 7, name: '玻璃', color: '#aed6f1', transparent: true, opacity: 0.6 },
      { id: 8, name: '圆石', color: '#5a5a5a' },
      { id: 9, name: '煤炭', color: '#222222' },
      { id: 10, name: '铁矿', color: '#c9a227' }
    ];

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    init();
    animate();

    function init() {
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      pitchObject = new THREE.Object3D();
      yawObject = new THREE.Object3D();
      yawObject.position.y = 2;
      pitchObject.add(yawObject);
      camera.add(pitchObject);
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 10, 60);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
      scene.add(light);

      const textureLoader = new THREE.TextureLoader();
      const materials = {};
      BLOCKS.forEach(b => {
        materials[b.id] = new THREE.MeshLambertMaterial({ color: b.color, transparent: b.transparent || false, opacity: b.opacity || 1 });
      });

      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const worldSize = 32;
      for (let x = 0; x < worldSize; x++) {
        for (let z = 0; z < worldSize; z++) {
          const h = Math.floor(4 + Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2);
          for (let y = 0; y <= h; y++) {
            let id = 3;
            if (y === h) id = 1;
            else if (y > h - 3) id = 2;
            const cube = new THREE.Mesh(geometry, materials[id]);
            cube.position.set(x - worldSize/2, y, z - worldSize/2);
            cube.userData = { id: id, isBlock: true };
            scene.add(cube);
            objects.push(cube);
          }
        }
      }

      renderer = new THREE.WebGLRenderer({ canvas: canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      blocker.addEventListener('click', () => {
        canvas.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === canvas) {
          blocker.style.display = 'none';
        } else {
          blocker.style.display = 'flex';
        }
      });

      canvas.addEventListener('mousemove', (event) => {
        if (document.pointerLockElement === canvas) {
          yawObject.rotation.y -= event.movementX * 0.002;
          pitchObject.rotation.x -= event.movementY * 0.002;
          pitchObject.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitchObject.rotation.x));
        }
      });

      document.addEventListener('keydown', (event) => {
        switch (event.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space': if (canJump) velocity.y += 12; canJump = false; break;
          case 'Digit1': selectedBlock = 1; updateHotbar(); break;
          case 'Digit2': selectedBlock = 2; updateHotbar(); break;
          case 'Digit3': selectedBlock = 3; updateHotbar(); break;
          case 'Digit4': selectedBlock = 4; updateHotbar(); break;
          case 'Digit5': selectedBlock = 5; updateHotbar(); break;
          case 'Digit6': selectedBlock = 6; updateHotbar(); break;
          case 'Digit7': selectedBlock = 7; updateHotbar(); break;
          case 'Digit8': selectedBlock = 8; updateHotbar(); break;
          case 'Digit9': selectedBlock = 9; updateHotbar(); break;
        }
      });

      document.addEventListener('keyup', (event) => {
        switch (event.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });

      canvas.addEventListener('mousedown', (event) => {
        if (document.pointerLockElement !== canvas) return;
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(objects);
        if (intersects.length > 0 && intersects[0].distance < 6) {
          const intersect = intersects[0];
          if (event.button === 0) {
            scene.remove(intersect.object);
            objects.splice(objects.indexOf(intersect.object), 1);
            showMessage("挖到了方块！");
          } else if (event.button === 2) {
            const pos = intersect.point.add(intersect.face.normal.multiplyScalar(0.5)).floor().addScalar(0.5);
            const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials[selectedBlock]);
            cube.position.copy(pos);
            cube.userData = { id: selectedBlock, isBlock: true };
            scene.add(cube);
            objects.push(cube);
          }
        }
      });

      updateHotbar();
    }

    function updateHotbar() {
      const block = BLOCKS[selectedBlock - 1];
      document.getElementById('info').textContent = '方块：' + block.name;
      const tb = document.getElementById('toolbar');
      tb.innerHTML = '';
      BLOCKS.forEach((b, i) => {
        const slot = document.createElement('div');
        slot.className = 'slot' + (i + 1 === selectedBlock ? ' active' : '');
        const icon = document.createElement('div');
        icon.className = 'slot-icon';
        icon.style.backgroundColor = '#' + b.color.toString(16).padStart(6, '0');
        slot.appendChild(icon);
        tb.appendChild(slot);
      });
    }

    function showMessage(msg) {
      const el = document.getElementById('message');
      el.textContent = msg;
      el.style.opacity = 1;
      setTimeout(() => { el.style.opacity = 0; }, 2000);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      if (document.pointerLockElement === canvas) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 30.0 * delta;
        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();
        if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;
        yawObject.translateX(-velocity.x * delta);
        yawObject.translateZ(-velocity.z * delta);
        yawObject.position.y += velocity.y * delta;
        if (yawObject.position.y < 2) {
          velocity.y = 0;
          yawObject.position.y = 2;
          canJump = true;
        }
      }
      renderer.render(scene, camera);
      prevTime = time;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

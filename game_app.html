<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>丁东政的超级跳绳与点球射门挑战 (Game 20 Pro)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1c2541 0%, #0b132b 75%);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .game-card {
      width: 100%;
      max-width: 440px;
      background: #1c2541;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.65);
      position: relative;
      border: 2px solid #3a506b;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .sound-btn {
      background: #0b132b;
      border: 1px solid #3a506b;
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
    }
    h1 { font-size: 22px; color: #48bfe3; margin-bottom: 4px; }
    .subtitle { font-size: 11.5px; color: #a5b4fc; margin-bottom: 12px; }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #0b132b;
      padding: 10px 8px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid #2b3a55;
    }
    .hud-box { display: flex; flex-direction: column; }
    .hud-val { font-size: 21px; font-weight: 800; color: #5bc0be; }
    .hud-lbl { font-size: 10.5px; color: #8d99ae; margin-top: 2px; }

    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      padding: 6px 10px;
      background: rgba(11, 19, 43, 0.7);
      border-radius: 8px;
      margin-bottom: 10px;
      color: #cbd5e1;
    }
    .difficulty-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    /* Canvas / Pitch Area */
    #pitch {
      width: 100%;
      height: 250px;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 24px, transparent 24px, transparent 48px),
        radial-gradient(circle at center, #2d6a4f 0%, #1b4332 100%);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      border: 2px solid #52b788;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .penalty-box {
      position: absolute;
      top: 12px;
      width: 220px;
      height: 95px;
      border: 2px solid rgba(255,255,255,0.28);
      border-top: none;
      pointer-events: none;
    }
    .goal-net {
      position: absolute;
      top: 14px;
      width: 168px;
      height: 54px;
      border: 3px solid #fff;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.12), rgba(255,255,255,0.12) 6px, transparent 6px, transparent 12px);
      transition: transform 0.2s ease;
    }
    .goal-net.shake {
      transform: scale(1.05);
      border-color: #fde047;
    }
    /* Clickable target zones inside goal */
    .target-zone {
      position: absolute;
      top: 18px;
      width: 48px;
      height: 46px;
      border-radius: 6px;
      border: 1px dashed rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      transition: background 0.15s;
    }
    .target-zone:hover { background: rgba(56, 189, 248, 0.25); }
    .target-left { left: calc(50% - 78px); }
    .target-mid { left: calc(50% - 24px); }
    .target-right { left: calc(50% + 30px); }

    .keeper {
      position: absolute;
      top: 40px;
      width: 38px;
      height: 38px;
      background: #e63946;
      border: 2px solid #fff;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.22s ease-out, transform 0.22s ease-out;
      z-index: 3;
    }
    .ball {
      position: absolute;
      bottom: 26px;
      width: 38px;
      height: 38px;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.36s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      z-index: 4;
    }

    /* Action buttons */
    .controls { margin-top: 14px; display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 13px 8px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-shoot-left { background: #3a86ff; color: white; }
    .btn-shoot-mid { background: #48cae4; color: #03045e; }
    .btn-shoot-right { background: #06d6a0; color: #073b4c; }

    .key-hint {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
    }

    /* Simulated Monetization Banner */
    .ad-banner {
      margin-top: 12px;
      background: #0b132b;
      border: 1px dashed #f59e0b;
      border-radius: 10px;
      padding: 10px;
      font-size: 11.5px;
      color: #fbbf24;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .ad-tag {
      background: #d97706;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      margin-right: 4px;
    }
    .ad-btn {
      background: #f59e0b;
      border: none;
      color: black;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
    }

    .popup-feedback {
      position: absolute;
      font-size: 26px;
      font-weight: 900;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.28s ease;
      text-shadow: 0 4px 12px rgba(0,0,0,0.65);
      z-index: 10;
    }
    .popup-feedback.show { opacity: 1; transform: scale(1.15) translateY(-16px); }

    /* In-page AdMob Video Modal (Replaces blocked native alert) */
    .ad-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 25, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .ad-modal-backdrop.active { display: flex; }
    .ad-modal {
      width: 100%;
      max-width: 360px;
      background: #1e293b;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .ad-progress-bar {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .ad-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #10b981);
      transition: width 0.25s linear;
    }
  </style>
</head>
<body>

<div class="game-card">
  <div class="top-bar">
    <span>🏆 丁东政专属体育电竞版</span>
    <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()">🔊 音效: 开启</button>
  </div>
  <h1>⚽ 绿茵射门大战</h1>
  <div class="subtitle">You B Tech #20 极简超休闲游戏原型 (零代码+广告位变现)</div>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-val" id="score">0</div>
      <div class="hud-lbl">进球得分</div>
    </div>
    <div class="hud-box">
      <div class="hud-val" id="streak">0</div>
      <div class="hud-lbl">当前连胜</div>
    </div>
    <div class="hud-box">
      <div class="hud-val" id="bestStreak">0</div>
      <div class="hud-lbl">最高连胜</div>
    </div>
    <div class="hud-box">
      <div class="hud-val" id="coins">10</div>
      <div class="hud-lbl">金币 (收益)</div>
    </div>
  </div>

  <div class="status-strip">
    <span id="keeperAiStatus">🧤 守门员状态：常规防守</span>
    <span class="difficulty-badge" id="multiplierBadge">💰 收益倍率 x1</span>
  </div>

  <div id="pitch">
    <div class="penalty-box"></div>
    <div class="goal-net" id="goalNet"></div>
    <div class="target-zone target-left" onclick="shoot('left')" title="点击射向左上死角">↖</div>
    <div class="target-zone target-mid" onclick="shoot('mid')" title="点击爆射中路">⬆</div>
    <div class="target-zone target-right" onclick="shoot('right')" title="点击推射右上死角">↗</div>
    <div class="keeper" id="keeper" style="left: calc(50% - 19px);">🧤</div>
    <div class="ball" id="ball" style="left: calc(50% - 19px);" onclick="shoot('mid')">⚽</div>
    <div class="popup-feedback" id="feedback">GOAL!</div>
  </div>

  <div class="controls">
    <button class="btn btn-shoot-left" id="btnLeft" onclick="shoot('left')">左路吊射 ↖</button>
    <button class="btn btn-shoot-mid" id="btnMid" onclick="shoot('mid')">爆射中路 ⬆</button>
    <button class="btn btn-shoot-right" id="btnRight" onclick="shoot('right')">右路推射 ↗</button>
  </div>
  <div class="key-hint">💡 支持点击球门靶心、下方按钮或键盘 <strong>← / ↑ / → (A / W / D)</strong> 射门</div>

  <!-- #20 核心亮点：游戏内激励广告变现位 (AdMob Mock) -->
  <div class="ad-banner">
    <div style="text-align: left;">
      <span class="ad-tag">AD</span>
      <span id="adBannerText">观看 5 秒广告：立刻复活连胜并双倍金币！</span>
    </div>
    <button class="ad-btn" onclick="watchAd()">领取 +50 💰</button>
  </div>
</div>

<!-- In-Page Simulated AdMob Modal -->
<div class="ad-modal-backdrop" id="adModal">
  <div class="ad-modal">
    <div style="font-size: 12px; color: #fbbf24; font-weight: bold;">🎬 AdMob 激励视频广告模拟</div>
    <h3 id="adModalTitle" style="margin-top: 8px; font-size: 17px;">正在播放：丁东政双摇跳绳特训营...</h3>
    <p id="adModalDesc" style="margin-top: 6px; font-size: 12.5px; color: #cbd5e1;">
      倒计时结束后即可获得 <strong>+50 金币</strong>、<strong>连胜纪录复活</strong> 与 <strong>3 次双倍金币射门 Buff</strong>！
    </p>
    <div class="ad-progress-bar">
      <div class="ad-progress-fill" id="adProgressFill"></div>
    </div>
    <div id="adCountdownText" style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">剩余 5 秒...</div>
    <button class="btn btn-shoot-right" id="adClaimBtn" style="width: 100%; padding: 10px;" disabled onclick="claimAdReward()">请稍候...</button>
  </div>
</div>

<script>
  const GAME_STORAGE_KEY = 'ddz_football_game_v2';

  let score = 0;
  let streak = 0;
  let bestStreak = 0;
  let lostStreakBeforeSave = 0;
  let coins = 10;
  let doubleCoinsShotsLeft = 0;
  let shooting = false;
  let soundEnabled = true;
  let audioCtx = null;
  let adTimer = null;

  const ball = document.getElementById('ball');
  const keeper = document.getElementById('keeper');
  const feedback = document.getElementById('feedback');
  const goalNet = document.getElementById('goalNet');

  function loadGameState() {
    try {
      const raw = localStorage.getItem(GAME_STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        score = Number(data.score) || 0;
        streak = Number(data.streak) || 0;
        bestStreak = Number(data.bestStreak) || 0;
        coins = typeof data.coins === 'number' ? data.coins : 10;
      }
    } catch (e) {
      // Ignore storage errors in restricted environments
    }
    updateHUD();
  }

  function saveGameState() {
    try {
      localStorage.setItem(GAME_STORAGE_KEY, JSON.stringify({
        score,
        streak,
        bestStreak,
        coins
      }));
    } catch (e) {
      // Ignore storage errors
    }
  }

  function initAudio() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'kick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.09); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.18); // G5
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
        osc.start(now);
        osc.stop(now + 0.38);
      } else if (type === 'save') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'reward') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    } catch (e) {
      // Ignore Web Audio errors
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggleBtn');
    if (btn) {
      btn.innerText = soundEnabled ? '🔊 音效: 开启' : '🔇 音效: 静音';
    }
  }

  function pickKeeperSide(playerDirection) {
    const sides = ['left', 'mid', 'right'];
    // Dynamic difficulty based on streak (#20 Module 4 requirement)
    // Higher streak slightly increases keeper's reflex chance while keeping gameplay fair
    const reflexChance = Math.min(0.15 + streak * 0.03, 0.42);
    if (Math.random() < reflexChance) {
      return playerDirection;
    }
    const otherSides = sides.filter(s => s !== playerDirection);
    return otherSides[Math.floor(Math.random() * otherSides.length)];
  }

  function shoot(direction) {
    if (shooting) return;
    shooting = true;
    playSound('kick');

    const keeperChoice = pickKeeperSide(direction);

    // Move keeper
    if (keeperChoice === 'left') {
      keeper.style.left = 'calc(50% - 72px)';
      keeper.style.transform = 'rotate(-18deg) scale(1.08)';
    } else if (keeperChoice === 'right') {
      keeper.style.left = 'calc(50% + 34px)';
      keeper.style.transform = 'rotate(18deg) scale(1.08)';
    } else {
      keeper.style.left = 'calc(50% - 19px)';
      keeper.style.transform = 'translateY(-6px) scale(1.1)';
    }

    // Move ball
    if (direction === 'left') {
      ball.style.transform = 'translate(-62px, -168px) scale(0.62) rotate(-180deg)';
    } else if (direction === 'right') {
      ball.style.transform = 'translate(62px, -168px) scale(0.62) rotate(180deg)';
    } else {
      ball.style.transform = 'translate(0px, -168px) scale(0.62) rotate(90deg)';
    }

    setTimeout(() => {
      if (direction !== keeperChoice) {
        // GOAL!
        score += 1;
        streak += 1;
        if (streak > bestStreak) bestStreak = streak;
        lostStreakBeforeSave = 0;

        const multiplier = doubleCoinsShotsLeft > 0 ? 2 : 1;
        const earned = (5 + Math.min(streak, 5)) * multiplier;
        coins += earned;
        if (doubleCoinsShotsLeft > 0) doubleCoinsShotsLeft--;

        goalNet.classList.add('shake');
        setTimeout(() => goalNet.classList.remove('shake'), 260);
        playSound('goal');
        showPopup(`⚽ 漂亮进球! +${earned}💰`, '#10b981');
      } else {
        // SAVED! Record previous streak so user can revive via AdMob!
        lostStreakBeforeSave = streak;
        streak = 0;
        if (doubleCoinsShotsLeft > 0) doubleCoinsShotsLeft--;
        playSound('save');
        showPopup('🧤 被扑出了!', '#ef4444');
      }
      updateHUD();
      saveGameState();

      // Reset ball position
      setTimeout(() => {
        ball.style.transform = 'none';
        keeper.style.left = 'calc(50% - 19px)';
        keeper.style.transform = 'none';
        shooting = false;
      }, 480);
    }, 360);
  }

  function showPopup(text, color) {
    feedback.innerText = text;
    feedback.style.color = color;
    feedback.classList.add('show');
    setTimeout(() => feedback.classList.remove('show'), 720);
  }

  function updateHUD() {
    document.getElementById('score').innerText = score;
    document.getElementById('streak').innerText = streak;
    const bestEl = document.getElementById('bestStreak');
    if (bestEl) bestEl.innerText = bestStreak;
    document.getElementById('coins').innerText = coins;

    const aiStatus = document.getElementById('keeperAiStatus');
    if (aiStatus) {
      if (streak >= 5) aiStatus.innerText = '🧤 守门员状态：🔥 觉醒级预判';
      else if (streak >= 3) aiStatus.innerText = '🧤 守门员状态：⚡ 高敏反应';
      else aiStatus.innerText = '🧤 守门员状态：常规防守';
    }

    const multBadge = document.getElementById('multiplierBadge');
    if (multBadge) {
      if (doubleCoinsShotsLeft > 0) {
        multBadge.innerText = `🔥 双倍金币 (${doubleCoinsShotsLeft}球)`;
        multBadge.style.background = 'rgba(245, 158, 11, 0.25)';
        multBadge.style.color = '#fbbf24';
      } else {
        multBadge.innerText = '💰 收益倍率 x1';
        multBadge.style.background = 'rgba(16, 185, 129, 0.2)';
        multBadge.style.color = '#34d399';
      }
    }

    const adText = document.getElementById('adBannerText');
    if (adText) {
      if (lostStreakBeforeSave > 0 && streak === 0) {
        adText.innerText = `观看广告：立刻复活 ${lostStreakBeforeSave} 连胜 + 领 50 金币！`;
      } else {
        adText.innerText = '观看 5 秒广告：领 50 金币 + 开启双倍金币 Buff！';
      }
    }
  }

  function watchAd() {
    const modal = document.getElementById('adModal');
    const fill = document.getElementById('adProgressFill');
    const countdownText = document.getElementById('adCountdownText');
    const claimBtn = document.getElementById('adClaimBtn');
    if (!modal) return;

    modal.classList.add('active');
    claimBtn.disabled = true;
    claimBtn.innerText = '广告播放中...';
    fill.style.width = '0%';

    let remaining = 5;
    countdownText.innerText = `剩余 ${remaining} 秒...`;

    if (adTimer) clearInterval(adTimer);
    adTimer = setInterval(() => {
      remaining -= 1;
      const pct = ((5 - remaining) / 5) * 100;
      fill.style.width = pct + '%';
      if (remaining > 0) {
        countdownText.innerText = `剩余 ${remaining} 秒...`;
      } else {
        clearInterval(adTimer);
        adTimer = null;
        countdownText.innerText = '✅ 广告播放完成！奖励已解锁';
        claimBtn.disabled = false;
        claimBtn.innerText = '🎉 立即领取 +50 金币与复活 Buff';
      }
    }, 450);
  }

  function claimAdReward() {
    const modal = document.getElementById('adModal');
    if (modal) modal.classList.remove('active');

    coins += 50;
    doubleCoinsShotsLeft += 3;
    let msg = '🎉 获得 +50 金币 & 双倍收益!';
    if (lostStreakBeforeSave > 0 && streak === 0) {
      streak = lostStreakBeforeSave;
      lostStreakBeforeSave = 0;
      msg = `🔥 已复活 ${streak} 连胜 & +50💰!`;
    }
    playSound('reward');
    updateHUD();
    saveGameState();
    showPopup(msg, '#fbbf24');
  }

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    const modal = document.getElementById('adModal');
    if (modal && modal.classList.contains('active')) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') shoot('left');
    else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') shoot('mid');
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') shoot('right');
  });

  loadGameState();
</script>
